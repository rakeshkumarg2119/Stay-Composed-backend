<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stay Composed Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F4EC;
    --panel:#FFFFFF;
    --panel-raised:#FBF9F3;
    --line:#E4DFD1;
    --navy:#12294B;
    --navy-dim:#5A6E88;
    --navy-faint:#93A2B4;
    --blue:#2F7DED;
    --teal:#1FBFA0;
    --green:#1FA97F;
    --red:#D2564A;
    --other:#93A2B4;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(47,125,237,0.06), transparent 60%),
      var(--cream);
    color:var(--navy);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .board{
    max-width:920px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }

  /* ── header ─────────────────────────────── */
  .signboard{
    display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    background:linear-gradient(180deg, var(--panel-raised), var(--panel));
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;
  }
  .signboard__title{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:19px; letter-spacing:0.01em; display:flex; align-items:center; gap:11px; }
  .signboard__mark{ width:34px; height:34px; flex:0 0 34px; }
  .signboard__name .c1{ color:var(--navy); } .signboard__name .c2{ background:linear-gradient(120deg,var(--blue),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .signboard__sub{ color:var(--navy-faint); font-weight:500; font-family:'IBM Plex Sans'; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }

  .signboard__status{ display:flex; align-items:center; gap:14px; }
  .status-pill{
    display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.06em;
    padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--cream);
  }
  .status-pill.is-live{ color:var(--teal); border-color:rgba(31,191,160,0.35); }
  .status-pill.is-down{ color:var(--red); border-color:rgba(210,86,74,0.35); }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulse 1.8s ease-out infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(31,191,160,0.5); }
    70%{ box-shadow:0 0 0 8px rgba(31,191,160,0); }
    100%{ box-shadow:0 0 0 0 rgba(31,191,160,0); }
  }
  .viewers{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--navy-faint); }

  /* ── filter strip ──────────────────────── */
  .mile-strip{
    display:flex; gap:8px; padding:14px 28px; overflow-x:auto; background:var(--panel);
    border-bottom:1px solid var(--line); position:sticky; top:61px; z-index:9;
  }
  .mile{
    flex:0 0 auto; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; color:var(--navy-dim);
    background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:8px 12px; cursor:pointer;
    display:flex; align-items:center; gap:8px; transition:border-color .15s, color .15s;
  }
  .mile b{ font-weight:500; color:var(--navy); background:rgba(18,41,75,0.06); padding:1px 6px; border-radius:10px; font-size:11px; }
  .mile:hover{ border-color:#C9C2AE; }
  .mile:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .mile.active{ color:var(--navy); border-color:var(--accent, var(--teal)); background:#fff; }
  .mile.active b{ background:var(--accent, var(--teal)); color:#fff; }
  .mile--items{ --accent:var(--green); }
  .mile--claims{ --accent:var(--blue); }
  .mile--chat{ --accent:var(--teal); }
  .mile--alert{ --accent:var(--red); }
  .mile--other{ --accent:var(--other); }

  /* ── feed ───────────────────────────────────────────── */
  .feed{ flex:1; padding:20px 28px 60px; display:flex; flex-direction:column; gap:10px; }

  .empty{
    margin-top:40px; text-align:center; color:var(--navy-dim); font-size:14px; line-height:1.6;
    max-width:380px; margin-left:auto; margin-right:auto; display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .empty img{ width:72px; height:auto; opacity:.9; }

  .ticket{
    position:relative; display:flex; background:var(--panel); border:1px solid var(--line);
    border-radius:2px 10px 10px 2px; padding:12px 16px 12px 18px; overflow:hidden;
    box-shadow:0 1px 2px rgba(18,41,75,0.03);
  }
  .ticket__bar{ position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--other); }
  .ticket--items .ticket__bar{ background:var(--green); }
  .ticket--claims .ticket__bar{ background:var(--blue); }
  .ticket--chat .ticket__bar{ background:var(--teal); }
  .ticket--alert .ticket__bar{ background:var(--red); }

  .ticket.is-new{ animation:drop-in .4s ease-out; }
  @keyframes drop-in{
    from{ transform:translateY(-8px); opacity:0; background-color:rgba(31,191,160,0.08); }
    to{ transform:translateY(0); opacity:1; background-color:transparent; }
  }

  .ticket__body{ flex:1; min-width:0; }
  .ticket__row1{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .ticket__method{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; color:var(--blue); letter-spacing:0.04em; }
  .ticket__path{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--navy); word-break:break-all; }
  .ticket__status{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:11px; padding:1px 7px; border-radius:10px; background:var(--cream); color:var(--navy-dim); }
  .ticket__status--ok{ color:var(--green); }
  .ticket__status--warn{ color:#B8862F; }
  .ticket__status--err{ color:var(--red); }

  .ticket__row2{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:6px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--navy-dim); }
  .ticket__stamp{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:10px; letter-spacing:0.06em;
    padding:2px 7px; border:1px solid currentColor; border-radius:3px; transform:rotate(-2deg); display:inline-block;
  }
  .ticket--items .ticket__stamp{ color:var(--green); }
  .ticket--claims .ticket__stamp{ color:var(--blue); }
  .ticket--chat .ticket__stamp{ color:var(--teal); }
  .ticket--alert .ticket__stamp{ color:var(--red); }
  .ticket--other .ticket__stamp{ color:var(--other); }

  @media (max-width:560px){
    .signboard{ padding:14px 18px; }
    .signboard__title{ font-size:16px; }
    .viewers{ display:none; }
    .mile-strip{ padding:12px 18px; top:53px; }
    .feed{ padding:16px 14px 50px; }
    .ticket__status{ margin-left:0; order:3; width:100%; }
  }
  @media (prefers-reduced-motion:reduce){ .pulse-dot, .ticket.is-new{ animation:none; } }
</style>
</head>

      Feed's quiet. Fire off a request against the API — from you, the app, or a teammate — and it lands here live.

  </main>
</div>

<script>
  const feedEl = document.getElementById('feed');
  const emptyState = document.getElementById('emptyState');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const viewersEl = document.getElementById('viewers');
  const filterStrip = document.getElementById('filterStrip');
  const countEls = {
    all: document.getElementById('count-all'),
    items: document.getElementById('count-items'),
    claims: document.getElementById('count-claims'),
    chat: document.getElementById('count-chat'),
    alert: document.getElementById('count-alert'),
    other: document.getElementById('count-other'),
  };

  const MAX_DOM_TICKETS = 150;
  let currentFilter = 'all';
  let ticketCount = 0;

  filterStrip.addEventListener('click', (e) => {
    const btn = e.target.closest('.mile');
    if (!btn) return;
    filterStrip.querySelectorAll('.mile').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter();
  });

  function applyFilter(){
    feedEl.querySelectorAll('.ticket').forEach(t => {
      const show = currentFilter === 'all' || t.dataset.category === currentFilter;
      t.style.display = show ? '' : 'none';
    });
  }

  function statusClass(status){
    if (status >= 500) return 'ticket__status--err';
    if (status >= 400) return 'ticket__status--warn';
    return 'ticket__status--ok';
  }

  function formatTime(iso){
    const d = new Date(iso);
    const pad = (n, l=2) => String(n).padStart(l, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}`;
  }

  function renderTicket(event, { animate }){
    emptyState.style.display = 'none';
    const cat = event.category || 'other';
    const el = document.createElement('article');
    el.className = `ticket ticket--${cat}` + (animate ? ' is-new' : '');
    el.dataset.category = cat;

    const stageBits = [];
    if (event.item_type)                stageBits.push(`<span>${event.item_type}</span>`);
    if (event.title)                    stageBits.push(`<span>“${event.title}”</span>`);
    if (event.item_status)              stageBits.push(`<span>${event.item_status}</span>`);
    if (event.matches !== undefined)    stageBits.push(`<span>${event.matches} match(es)</span>`);
    if (event.verified !== undefined)   stageBits.push(`<span>${event.verified ? '✅ verified' : '❌ not verified'}</span>`);
    if (event.matched)                  stageBits.push(`<span>${event.matched} fields</span>`);
    if (event.confidence !== undefined) stageBits.push(`<span>${event.confidence}% confidence</span>`);
    if (event.thread_status)            stageBits.push(`<span>${event.thread_status}</span>`);
    if (event.blood_type)               stageBits.push(`<span>🩸 ${event.blood_type}</span>`);
    if (event.recipients !== undefined) stageBits.push(`<span>${event.recipients} notified</span>`);

    el.innerHTML = `
      <div class="ticket__bar"></div>
      <div class="ticket__body">
        <div class="ticket__row1">
          <span class="ticket__method">${event.method}</span>
          <span class="ticket__path">${event.path}</span>
          <span class="ticket__status ${statusClass(event.status)}">${event.status}</span>
        </div>
        <div class="ticket__row2">
          <span class="ticket__time">${formatTime(event.time)}</span>
          <span class="ticket__stamp">${event.category_label || 'SYSTEM'}</span>
          <span class="ticket__duration">${event.duration_ms}ms</span>
          <span class="ticket__client">${event.client || ''}</span>
        </div>
        ${stageBits.length ? `<div class="ticket__row2">${stageBits.join('')}</div>` : ''}
      </div>
    `;
    if (currentFilter !== 'all' && cat !== currentFilter) el.style.display = 'none';
    feedEl.insertBefore(el, feedEl.firstChild);
    ticketCount++;
    if (ticketCount > MAX_DOM_TICKETS){
      const last = feedEl.lastElementChild;
      if (last) feedEl.removeChild(last);
      ticketCount--;
    }
  }

  function updateCounts(stats){
    countEls.all.textContent = stats.total ?? 0;
    countEls.items.textContent = stats.items ?? 0;
    countEls.claims.textContent = stats.claims ?? 0;
    countEls.chat.textContent = stats.chat ?? 0;
    countEls.alert.textContent = stats.alert ?? 0;
    countEls.other.textContent = stats.other ?? 0;
  }

  function setLive(){
    statusPill.classList.remove('is-down');
    statusPill.classList.add('is-live');
    statusText.textContent = 'LIVE';
  }
  function setDown(){
    statusPill.classList.remove('is-live');
    statusPill.classList.add('is-down');
    statusText.textContent = 'OFFLINE — RECONNECTING';
    viewersEl.textContent = '';
  }

  let socket;
  function connect(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    socket = new WebSocket(`${proto}://${location.host}/ws/live`);

    socket.onopen = () => setLive();

    socket.onmessage = (msg) => {
      const payload = JSON.parse(msg.data);
      if (payload.type === 'init'){
        feedEl.querySelectorAll('.ticket').forEach(t => t.remove());
        ticketCount = 0;
        payload.events.slice().reverse().forEach(ev => renderTicket(ev, { animate:false }));
        updateCounts(payload.stats);
        setViewers(payload.viewers);
      } else if (payload.type === 'event'){
        renderTicket(payload.event, { animate:true });
        updateCounts(payload.stats);
      } else if (payload.type === 'viewers'){
        setViewers(payload.viewers);
      }
    };

    socket.onclose = () => { setDown(); setTimeout(connect, 2000); };
    socket.onerror = () => socket.close();
  }

  function setViewers(n){
    viewersEl.textContent = n === 1 ? '1 online' : `${n} online`;
  }

  connect();
</script>

</html>
